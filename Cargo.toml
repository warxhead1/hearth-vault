[package]
name = "hearth-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A secrets vault built so coding agents can use your keys without ever seeing them."
repository = "https://github.com/warxhead1/hearth-vault"
homepage = "https://github.com/warxhead1/hearth-vault"
keywords = ["secrets", "vault", "security", "agent", "credentials"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"
exclude = ["/.github", "/CONTRACT.md"]

[lib]
name = "hearth_vault"
path = "src/lib.rs"

[[bin]]
name = "hearth-vault"
path = "src/main.rs"

[features]
default = ["os-keyring"]
# TPM2 links libtss2-esys (C). Opt-in: a bare `cargo install` must not need it.
tpm2 = ["dep:tss-esapi"]
os-keyring = ["dep:keyring"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
hkdf = "0.12"
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }

keyring = { version = "3.6", optional = true }
tss-esapi = { version = "7.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
