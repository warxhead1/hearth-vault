[package]
name = "hearth-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A secrets vault built so coding agents can use your keys without ever seeing them."
repository = "https://github.com/warxhead1/hearth-vault"
homepage = "https://github.com/warxhead1/hearth-vault"
keywords = ["secrets", "vault", "security", "agent", "credentials"]
categories = ["command-line-utilities", "cryptography"]
readme = "README.md"
exclude = ["/.github", "/CONTRACT.md"]

[lib]
name = "hearth_vault"
path = "src/lib.rs"

[[bin]]
name = "hearth-vault"
path = "src/main.rs"

# Diagnostic for "why is tier 2 not working on my machine" -- times each
# keyring operation separately, which is how the locked-collection hang was
# pinned down. Needs the backend it probes.
[[example]]
name = "keyring_probe"
required-features = ["os-keyring"]

[features]
default = ["os-keyring", "github-app-token"]
# TPM2 links libtss2-esys (C). Opt-in: a bare `cargo install` must not need it.
tpm2 = ["dep:tss-esapi"]
os-keyring = ["dep:keyring"]
# The ONLY code in this crate that opens a network socket is minting a GitHub
# App installation token (POST api.github.com, and only when you run that one
# subcommand). It is a feature so that "this binary cannot phone home" is
# something you can VERIFY rather than something we assert: build with
# `--no-default-features --features os-keyring` and no HTTP client is compiled
# into the binary at all. CI's no-network-build job proves reqwest is absent
# from that dependency graph on every push.
github-app-token = ["dep:reqwest"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
hkdf = "0.12"
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
ring = "0.17"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }

tss-esapi = { version = "7.6", optional = true }

# keyring 3.x ships NO backend by default: every platform silently falls back
# to an in-memory `mock` store unless you opt into the native one. A vault
# that "sealed" tier-2 secrets into that mock would report success and store
# nothing -- so the platform feature is mandatory here, per target.
#
# Linux uses async-secret-service (zbus, pure Rust) rather than
# sync-secret-service (libdbus, a C library): it keeps `cargo install`
# working with no system -dev packages and keeps the door open for static
# builds. keyring blocks on it internally, so our call sites stay sync.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", optional = true, features = [
    "async-secret-service",
    "crypto-rust",
    "async-io",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", optional = true, features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
