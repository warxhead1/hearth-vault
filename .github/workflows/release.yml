# Build release binaries on a tag and attach them to the GitHub Release.
#
# Deliberately plain: no release-tooling dependency, no generated file that
# version-checks itself, no `curl | sh` of a third-party installer inside the
# job that produces the binaries people will trust with their secrets. Every
# target is built by a stock runner of that architecture -- nothing is
# cross-compiled -- so a build that passes here ran the real linker for the
# platform it claims.
#
# Each artifact ships with a .sha256 next to it, and the checksums are also
# collected into one SHA256SUMS file on the release for convenience.
#
# NOT solved here (see SECURITY.md):
#   - macOS binaries are unsigned and unnotarized. Gatekeeper will warn on
#     first run. Fixing that needs an Apple Developer ID in repo secrets.
#   - Windows binaries are unsigned (needs an Authenticode certificate).

name: Release

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than latest: binaries link against that
          # runner's glibc, and building on the OLDEST supported runner is
          # what makes them run on older distros too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Full default features, keyring included: the Linux backend is
          # zbus (pure Rust D-Bus), so nothing here needs libsecret or
          # libdbus linked in. CI's musl job asserts the result really is
          # static, so this is verified on every push, not assumed.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            packages: musl-tools
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      # Smoke-test the artifact we are about to publish, on the machine that
      # built it. Cheap, and it catches a binary that cannot even start (a
      # missing shared library on musl, say) before anyone downloads it.
      - name: Smoke-test the built binary
        if: "!startsWith(matrix.target, 'aarch64-apple')"
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/hearth-vault"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="hearth-vault-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/hearth-vault.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/hearth-vault" "dist/$NAME/"
          fi
          cp README.md SECURITY.md MIGRATING.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
            ASSET="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            ASSET="$NAME.tar.gz"
          fi
          # shasum is present on macOS; sha256sum on Linux and Git-Bash.
          if command -v sha256sum > /dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One combined checksum file, so a verifier does not have to fetch a
      # .sha256 per artifact to check what they downloaded.
      - name: Collect checksums
        run: cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Verifying your download

            Every artifact has a matching `.sha256`, and all of them are
            listed in `SHA256SUMS`:

            ```sh
            sha256sum -c --ignore-missing SHA256SUMS
            ```

            macOS and Windows binaries are **not code-signed yet**, so
            Gatekeeper/SmartScreen will warn on first run. Verify the
            checksum above, or build from source with `cargo install
            --locked --git https://github.com/warxhead1/hearth-vault`.

            The `x86_64-unknown-linux-musl` build is fully static and needs
            no system libraries. It still supports the OS-keyring tier, but
            that tier needs a Secret Service daemon running on the machine;
            without one, `hearth-vault` falls back to the software tier.
