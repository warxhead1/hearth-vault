name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Deliberately NOT --all-features: the opt-in `tpm2` feature only
      # builds on Linux x86_64/arm (tss-esapi-sys's build.rs panics on any
      # other (arch, os) tuple, including Windows and Apple-silicon macOS —
      # `--all-features` here would fail to even compile on two of the
      # three matrix legs before a single test ran). Default features
      # (os-keyring) is exactly the surface every platform must support;
      # tpm2 gets its own dedicated Linux-only job below.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # `--all-targets` picks up tests/cli.rs (the end-to-end CLI suite)
      # alongside the unit tests already in src/. This is the step that
      # actually exercises the Windows DACL code and (via os_keyring's
      # #[ignore]d test, re-enabled below on macOS) the Keychain path —
      # previously this workflow proved only that those code paths
      # *compiled*, never that they *ran*.
      - name: cargo test
        run: cargo test --all-targets

      # The OS-keyring roundtrip test is #[ignore]d by default because a
      # fresh macOS runner's default keychain is locked with no GUI to
      # unlock it, and Linux/Windows keyring backends need no such dance.
      # On macOS specifically, spin up and unlock a disposable keychain so
      # this genuinely runs instead of silently reading as "passing"
      # coverage it never exercised.
      - name: Create + unlock temporary keychain (macOS only)
        if: runner.os == 'macOS'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/hearth-vault-ci.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          # Make it the default AND put it first in the search list — the
          # `keyring` crate (via the Security framework) resolves generic
          # passwords against the default keychain, but a locked/absent
          # default earlier in the search list can still shadow it.
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/"//g')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "HEARTH_VAULT_CI_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Windows needs no keychain dance -- the Credential Manager is usable
      # straight from a CI session -- so the same roundtrip runs there too.
      # This test is the ONLY thing that distinguishes a real backend from
      # keyring's silent in-memory `mock` fallback (see Cargo.toml), so it
      # must run on every push, on every platform that has a store.
      - name: cargo test -- --ignored (OS keyring roundtrip, macOS + Windows)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          RUST_BACKTRACE: "1"
          HEARTH_VAULT_REQUIRE_KEYRING: "1"
        run: cargo test --lib -- --ignored --exact hsm::os_keyring::tests::test_os_keyring_roundtrip

      # Linux runners ship no Secret Service daemon, so this roundtrip used to
      # self-skip here -- meaning the platform most users are on was the one
      # platform where tier 2 never actually ran. Start a private session bus
      # and a gnome-keyring daemon on it, unlock the default collection with a
      # throwaway password fed on stdin (which is where --unlock reads it),
      # and require the test to really execute.
      #
      # dbus-run-session gives this step its own bus, so nothing here can
      # collide with, or leak into, anything else on the runner.
      - name: Install gnome-keyring + dbus (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11

      - name: cargo test -- --ignored (Secret Service roundtrip, Linux)
        if: runner.os == 'Linux'
        env:
          RUST_BACKTRACE: "1"
          HEARTH_VAULT_REQUIRE_KEYRING: "1"
        run: |
          # Compile first: cargo's own build output would otherwise be buried
          # inside the keyring session below, making a failure unreadable.
          cargo test --lib --no-run
          dbus-run-session -- bash -euo pipefail -c '
            echo -n "ci-throwaway-keyring-password" \
              | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --lib -- --ignored --exact hsm::os_keyring::tests::test_os_keyring_roundtrip
          '

      # If the roundtrip fails, the useful question is "which keychain did
      # the write land in, and can the plain `security` CLI round-trip the
      # same service/account pair at all?" -- that separates a bug in our
      # code from a keychain the runner never actually made writable.
      # keyring v3 always resolves SecKeychain::default_for_domain(User) and
      # cannot be pointed at a named temp keychain, so the default is the
      # only thing that matters here.
      - name: Diagnose keychain state (macOS, on failure)
        if: failure() && runner.os == 'macOS'
        run: |
          echo "--- default keychain (user domain) ---"
          security default-keychain -d user || true
          echo "--- search list ---"
          security list-keychains -d user || true
          echo "--- CLI add/find roundtrip against the same service ---"
          security add-generic-password -s hearth-vault -a ci-diagnostic \
            -w not-a-real-secret -U "$HEARTH_VAULT_CI_KEYCHAIN" && echo "add: ok" || echo "add: FAILED"
          security find-generic-password -s hearth-vault -a ci-diagnostic \
            "$HEARTH_VAULT_CI_KEYCHAIN" > /dev/null && echo "find(explicit): ok" || echo "find(explicit): FAILED"
          # No keychain argument = search the default search list, which is
          # the closest CLI analogue to what the keyring crate does.
          security find-generic-password -s hearth-vault -a ci-diagnostic \
            > /dev/null && echo "find(default): ok" || echo "find(default): FAILED"

      - name: Remove temporary keychain (macOS only)
        if: runner.os == 'macOS' && always()
        run: |
          if [ -n "${HEARTH_VAULT_CI_KEYCHAIN:-}" ]; then
            security delete-keychain "$HEARTH_VAULT_CI_KEYCHAIN" || true
          fi

      # Independent confirmation of the DACL our own Win32 code sets,
      # using a completely separate code path (`icacls`, not
      # GetNamedSecurityInfoW) so a bug shared between `restrict_to_owner`
      # and its own unit test can't hide from CI. `set` auto-creates the
      # vault file with no `init` step needed (HEARTH_VAULT_PASSPHRASE
      # supplied, so nothing prompts).
      - name: Verify vault file ACL with icacls (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HEARTH_VAULT_PASSPHRASE: ci-icacls-check-passphrase-not-a-real-secret
        run: |
          $vaultHome = Join-Path $env:RUNNER_TEMP "hv-icacls-check"
          New-Item -ItemType Directory -Force -Path $vaultHome | Out-Null
          $env:HEARTH_VAULT_HOME = $vaultHome

          "icacls-probe-value" | cargo run --quiet -- set acl/icacls-probe --tier 3
          if ($LASTEXITCODE -ne 0) { throw "hearth-vault set failed" }

          $vaultFile = Join-Path $vaultHome "vault.json"
          if (-not (Test-Path $vaultFile)) { throw "vault file was not created at $vaultFile" }

          $aclOutput = icacls $vaultFile
          Write-Output $aclOutput

          $currentUser = "$env:USERDOMAIN\$env:USERNAME"
          $userLine = $aclOutput | Select-String -SimpleMatch $env:USERNAME
          if (-not $userLine) {
            throw "icacls output does not list the current user ($currentUser) on ${vaultFile}: $aclOutput"
          }

          # No broader-than-owner identity should hold any grant on this file.
          $broadGrantees = @('Everyone', 'BUILTIN\Users', 'Authenticated Users', 'NT AUTHORITY\Authenticated Users')
          foreach ($name in $broadGrantees) {
            if ($aclOutput -match [regex]::Escape($name)) {
              throw "icacls shows a broader-than-owner grant ('$name') on ${vaultFile}: $aclOutput"
            }
          }

  # Tier 1 (TPM2), exercised for real against a SOFTWARE TPM.
  #
  # No hosted runner has a TPM chip, so this used to be a compile-only job:
  # it proved the opt-in feature still built and nothing more, leaving the
  # highest-security tier as the one tier whose seal/unseal had never run
  # anywhere but the author's desktop. swtpm closes that gap -- it is the
  # same TPM 2.0 reference implementation the kernel's own test suites use,
  # reached through the standard tss2 loader via HEARTH_VAULT_TCTI.
  #
  # A simulator is not a hardware attestation: it proves our sealing logic,
  # PCR0 policy construction and blob format are correct, NOT that a real
  # chip enforces them. Hardware is covered by selfhosted.yml.
  tpm2:
    name: tpm2 (swtpm simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libtss2-dev + swtpm
        run: |
          sudo apt-get update
          # libtss2-tcti-swtpm0 is the piece that makes HEARTH_VAULT_TCTI=swtpm:...
          # resolvable by the tss2 loader; libtss2-dev alone does not pull it in.
          sudo apt-get install -y \
            libtss2-dev libtss2-tcti-swtpm0 swtpm swtpm-tools tpm2-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Default builds must NEVER require libtss2-esys -- that is the whole
      # point of tpm2 being opt-in, so keep proving the feature compiles
      # before spending time on the simulator.
      - name: cargo build --features tpm2
        run: cargo build --features tpm2

      - name: Start swtpm
        run: |
          mkdir -p "$RUNNER_TEMP/swtpm"
          swtpm socket \
            --tpmstate "dir=$RUNNER_TEMP/swtpm" \
            --ctrl "type=tcp,port=2322" \
            --server "type=tcp,port=2321" \
            --flags not-need-init,startup-clear \
            --tpm2 \
            --daemon
          # Wait for the socket rather than sleeping a guessed interval.
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/2321) 2>/dev/null; then
              echo "swtpm is listening"; exit 0
            fi
            sleep 0.2
          done
          echo "swtpm never came up"; exit 1

      # PCR0 on a freshly started simulator is all-zeroes and never extended,
      # which is fine: the test seals to whatever PCR0 currently reads and
      # unseals against the same value. What it proves is that the policy
      # session, the sealed-object template and the blob round-trip are
      # correct -- the parts that were previously unexecuted code.
      #
      # HEARTH_VAULT_REQUIRE_TPM2 turns "no TPM here" from a skip into a
      # failure, so this job cannot pass by silently doing nothing.
      - name: cargo test -- --ignored (TPM2 seal/unseal roundtrip)
        env:
          RUST_BACKTRACE: "1"
          HEARTH_VAULT_TCTI: swtpm:host=127.0.0.1,port=2321
          HEARTH_VAULT_REQUIRE_TPM2: "1"
        run: |
          cargo test --features tpm2 --lib -- --ignored --test-threads=1 \
            --exact hsm::tpm2::tests::test_tpm2_seal_unseal_roundtrip

  # "It cannot phone home" is only worth saying if it is checked. Build the
  # network-free configuration and prove no HTTP client is even present in
  # the dependency graph -- not that we avoid calling one, that there is
  # none to call. See Cargo.toml [features].github-app-token.
  no-network-build:
    name: build (no network client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --no-default-features --features os-keyring
        run: cargo build --no-default-features --features os-keyring

      - name: Assert no HTTP client in the dependency graph
        run: |
          set -euo pipefail
          TREE=$(cargo tree --no-default-features --features os-keyring -e normal)
          for crate in reqwest hyper ureq curl isahc; do
            if grep -qE "^[^a-z]*${crate} v" <<< "$TREE"; then
              echo "FAIL: '$crate' is in the no-network dependency graph:"
              grep -E "${crate} v" <<< "$TREE"
              exit 1
            fi
          done
          echo "no HTTP client present"

      # Belt and braces: even the DEFAULT build must contain exactly one
      # outbound URL, and it must be the GitHub App endpoint. A new call
      # site added anywhere else fails here rather than shipping quietly.
      - name: Assert the default build has exactly one outbound URL
        run: |
          set -euo pipefail
          HITS=$(grep -rnoE 'https?://[a-zA-Z0-9.-]+' src/ --include='*.rs' \
                 | grep -v 'src/scan.rs' \
                 | grep -vE '://(schemas|www|docs|github)\.' || true)
          echo "$HITS"
          COUNT=$(grep -c 'api.github.com' <<< "$HITS" || true)
          TOTAL=$(grep -c . <<< "$HITS" || true)
          if [ "$TOTAL" != "$COUNT" ] || [ "$COUNT" != "1" ]; then
            echo "FAIL: expected exactly one outbound URL (api.github.com), got $TOTAL"
            exit 1
          fi

  # Proves the software-only path (no OS keyring, no TPM2) still compiles —
  # this is the floor every platform must support.
  no-default-features-build:
    name: build (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --no-default-features
        run: cargo build --no-default-features

  # musl is a release target with no other CI coverage, and it is the one
  # most likely to break: it is statically linked, so any dependency that
  # reaches for a C library fails here and nowhere else. Built WITH default
  # features on purpose -- the Linux keyring backend is zbus (pure Rust, no
  # libdbus/libsecret to link), so if that assumption is wrong this job is
  # what says so, rather than a user discovering it in a release artifact.
  musl-build:
    name: build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --target x86_64-unknown-linux-musl
        run: cargo build --locked --target x86_64-unknown-linux-musl

      # Static means static: a musl artifact that turns out to be
      # dynamically linked would fail on the minimal systems it exists for.
      - name: Assert the binary is statically linked
        run: |
          BIN=target/x86_64-unknown-linux-musl/debug/hearth-vault
          file "$BIN"
          # A dynamically linked binary lists its libraries as `lib... => path`.
          # Static builds instead print "statically linked" or "not a dynamic
          # executable" -- which wording depends on the loader, so match on the
          # presence of actual dependencies rather than on either phrase.
          if ldd "$BIN" 2>&1 | grep -q '=>'; then
            echo "FAIL: musl build is dynamically linked:"; ldd "$BIN"; exit 1
          fi
          "$BIN" --version
